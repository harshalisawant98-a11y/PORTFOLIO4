<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather API Demo</title>
</head>
<body>
  <h2>Weather Data Demo</h2>
  <div id="weather"></div>

  <script>
    // Your API key
    const apiKey = "2e6cb2e86f396907aefcaf204500a531";

    // Choose a city
    const city = "Mumbai";

    // API endpoint
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

    // Fetch live data
    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error("Network response was not ok " + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        console.log("Full JSON Response:", data); // log entire response

        // Extract data points
        const temp = data.main.temp;
        const description = data.weather[0].description;

        // Display on page
        document.getElementById("weather").innerHTML =
          `<strong>${city}</strong><br>Temperature: ${temp}°C<br>Condition: ${description}`;
      })
      .catch(error => console.error("Error fetching data:", error));
  </script>
</body>
</html>
